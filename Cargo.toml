[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/browser",
    "crates/uploader-bunkr",
    "crates/uploader-gofile",
    "crates/uploader-fileditch",
    "crates/uploader-filester",
    "crates/uploader-goonbox",
    "crates/uploader-pixeldrain",
    "crates/upio",
    "crates/config",
    "crates/cli",
    "crates/gui",
]
default-members = ["crates/cli"]

# Rune's own workspace patches these crates; a dependency's `[patch]` does not reach the
# workspace that depends on it, so the same patches live here.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }
winit = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sn0w12/upio"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2"
async-trait = "0.1"
base64 = "0.22"
chaser-oxide = { version = "0.2", default-features = false, features = ["native-tls", "zip0"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9"
json5 = "1.3"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "multipart", "json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
terminal_size = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

upio = { path = "crates/upio" }
upio-core = { path = "crates/core" }
upio-browser = { path = "crates/browser" }
upio-config = { path = "crates/config" }
uploader-bunkr = { path = "crates/uploader-bunkr" }
uploader-gofile = { path = "crates/uploader-gofile" }
uploader-fileditch = { path = "crates/uploader-fileditch" }
uploader-filester = { path = "crates/uploader-filester" }
uploader-goonbox = { path = "crates/uploader-goonbox" }
uploader-pixeldrain = { path = "crates/uploader-pixeldrain" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
