[package]
name = "upio-gui"
description = "upio desktop GUI built with Rune and rune-kit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
upio = { workspace = true }
upio-config = { workspace = true }
rune = { workspace = true }
rune-kit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
futures = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
    "NSApplication",
    "NSAppearance",
    "NSResponder",
    "NSColor",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }
