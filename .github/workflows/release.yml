name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches the CLI version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "upio-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match upio-cli version $version" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: upio
          package: upio-cli
          archive: upio-cli-$target
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          include: LICENSE-MIT,LICENSE-APACHE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}

  gui:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-15-intel
            formats: app,dmg
          - os: macos-latest
            formats: app,dmg
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.os }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package
        run: cargo packager --release -p upio-gui --formats ${{ matrix.formats }}

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sha256) continue ;;
            esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          for file in dist/*; do
            [ -f "$file" ] || continue
            files+=("$file")
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
